services:
  # ----------------------------------------------------------------------------
  # Serviço da Aplicação Backend (FastAPI + Poetry)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: c216_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=c216_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/c216_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - c216_network

  # ----------------------------------------------------------------------------
  # Serviço do Banco de Dados Relacional (PostgreSQL 16 Alpine)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: c216_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: c216_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d c216_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - c216_network

# ------------------------------------------------------------------------------
# Volumes persistentes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: c216_postgres_data

# ------------------------------------------------------------------------------
# Redes personalizadas para comunicação distribuída
# ------------------------------------------------------------------------------
networks:
  c216_network:
    name: c216_network
    driver: bridge
