[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Backend para Práticas de Sistemas Distribuídos (C216)"
authors = ["Matheus <matheus.augusto@ges.inatel.br>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110.0"
uvicorn = ">=0.28.0"
pydantic = ">=2.6.0"
sqlalchemy = "^2.1.5"
psycopg = {extras = ["binary"], version = "^3.3.6"}
alembic = "^1.20.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.27.0"
ruff = "^0.17.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
